name: Build GRID 26 Android APK

on:
  push:
    branches:
      - f1-2026-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.5 and matching Android templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.5-stable_linux.x86_64 godot
          chmod +x godot
          curl -fL --retry 3 -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.stable"
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.stable/"

      - name: Configure editor Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import assets
        run: ./godot --headless --path . --editor --quit

      - name: Check GDScript syntax
        shell: bash
        run: |
          set -e
          ./godot --headless --path . --check-only --script res://Car.gd
          ./godot --headless --path . --check-only --script res://Track.gd
          ./godot --headless --path . --check-only --script res://Game.gd

      - name: Export Android debug APK
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug Android build/GRID26-debug.apk
          test -s build/GRID26-debug.apk
          ls -lh build/GRID26-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GRID26-APK
          path: build/GRID26-debug.apk
          if-no-files-found: error
